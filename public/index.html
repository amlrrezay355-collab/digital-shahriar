<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دیجیتال شهریار</title>
  <style>
    body{margin:0;font-family:Arial;background:#111827;color:white}
    header{padding:18px;background:#1f2937;text-align:center;font-size:22px}
    #messages{height:calc(100vh - 130px);overflow:auto;padding:15px}
    .message{background:#374151;padding:10px 14px;margin:8px 0;border-radius:12px;width:max-content}
    form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#1f2937}
    input{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px}
    button{padding:13px 20px;border:0;border-radius:10px;background:#ec407a;color:white}
  </style>
</head>
<body>
<header>💬 دیجیتال شهریار</header>

<div id="messages"></div>

<form id="form">
  <input id="input" placeholder="پیامت را بنویس..." autocomplete="off">
  <button>ارسال</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const form=document.getElementById("form");
const input=document.getElementById("input");
const messages=document.getElementById("messages");

form.addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  socket.emit("chat message",text);
  input.value="";
});

socket.on("chat message",message=>{
  const div=document.createElement("div");
